<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Pokédex - Alan</title>
</head>
<body>
    <div class="container">
        <h1>🟣 Pokédex V2.1.4</h1>
        <h2> by: Alan Alexis M Benitez</h2>

    <div class="area-sugestoes">
    <div class="lista-nomes">
        <span class="nome-sugestao">bulbasaur</span>
        <span class="nome-sugestao">blastoise</span>
        <span class="nome-sugestao">pidgeotto</span>
        <span class="nome-sugestao">pidgey</span>
        <span class="nome-sugestao">rattata</span>
        <span class="nome-sugestao">raticate</span>
        <span class="nome-sugestao">spearow</span>
    </div>
</div>

        <form id="formulario-pokemon" class="area-formulario">
            <input type="text" id="input-pokemon" placeholder="Nome do Pokémon" required>
            <button type="submit">Pesquisar Dados</button>
        </form>

        <div id="area-resultado" class="area-resultado">
            <p id="mensagem">Aguarde o retorno dos resultados...</p>
            
            <ul id="lista-pokemon" style="display: none;">
                <li><strong>Nome:</strong> <span id="info-nome"></span></li>
                <li><strong>ID:</strong> <span id="info-id"></span></li>
                <li><strong>Altura:</strong> <span id="info-altura"></span></li>
                <li><strong>Peso:</strong> <span id="info-peso"></span></li>
                <li><strong>Habilidades:</strong> <span id="info-habilidades"></span></li>
            </ul>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
