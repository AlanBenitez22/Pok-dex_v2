<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <title>Pokédex</title>
</head>
<body>
    <div class="container">
        <h1>Minha Pokédex - - Alan Alexis M Benitez</h1>

        <form id="formulario-pokemon" class="area-formulario">
            <input type="text" id="input-pokemon" placeholder="Nome do Pokémon" required>
            <button type="submit">Pesquisar</button>
        </form>

        <div id="area-resultado" class="area-resultado">
            <p id="mensagem">Aguardando</p>
            
            <ul id="lista-pokemon" style="display: none;">
                <li><strong>Nome:</strong> <span id="info-nome"></span></li>
                <li><strong>ID:</strong> <span id="info-id"></span></li>
                <li><strong>Altura:</strong> <span id="info-altura"></span></li>
                <li><strong>Peso:</strong> <span id="info-peso"></span></li>
                <li><strong>Habilidades:</strong> <span id="info-habilidades"></span></li>
            </ul>
        </div>
    </div>
    <script src="index.js"></script>

</body>
</html>
